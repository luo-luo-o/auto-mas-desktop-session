[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mas-desktop-session"
version = "0.1.0"
description = "Windows desktop session plugin for AUTO-MAS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AUTO-MAS Team" }]
keywords = ["auto-mas-plugin", "auto-mas-id:desktop_session"]
dependencies = [
    "auto-mas-core>=5.9.0b2,<6",
    "auto-mas-win-process-adapter>=0.1.1,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
